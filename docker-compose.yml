# Disposable local stack. It does not replace native Windows PostgreSQL.
# Project name perchpoint-phase3 keeps volumes away from other Compose projects.
# Host ports bind to loopback. Credentials here are disposable local values.
name: perchpoint-phase3
services:
  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-not-production
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - perchpoint_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data
  migrate:
    image: perchpoint-api:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: &app_env
      PHASE3_ENVIRONMENT: local
      PHASE3_COMMIT: ${PHASE3_COMMIT:-local}
      PHASE2_LOCAL_AUTH: development
      PHASE2_ADMIN_URL: postgresql+psycopg://postgres:local-only-not-production@postgres:5432/postgres
      PHASE2_MIGRATOR_URL: postgresql+psycopg://perchpoint_migrator:local-only-not-production@postgres:5432/perchpoint_phase2
      PHASE2_RUNTIME_URL: postgresql+psycopg://perchpoint_runtime:local-only-not-production@postgres:5432/perchpoint_phase2
      PHASE2_JWT_SECRET: local-only-not-production-jwt-secret-32-plus
      PHASE2_DEV_PASSWORD: local-only-not-production-password
      PHASE2_WEBHOOK_SECRET: local-only-not-production-webhook
    command: ["python", "-m", "perchpoint.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data
  seed:
    image: perchpoint-api:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment: *app_env
    command: ["python", "-m", "perchpoint.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data
  api:
    image: perchpoint-api:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *app_env
      PHASE6_PROCESS_ROLE: api
      PHASE6_WORKER_CREDENTIAL: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - data
      - ingress
  worker:
    image: perchpoint-api:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      <<: *app_env
      PHASE6_PROCESS_ROLE: worker
    command: ["python", "-m", "perchpoint.worker"]
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - data
  web:
    image: perchpoint-web:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      REACT_APP_PHASE3_ENVIRONMENT: local
      REACT_APP_SHOW_DEMO_LABELS: "true"
      REACT_APP_ENABLE_SEEDED_PREVIEWS: "true"
      API_UPSTREAM: http://api:8000
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ingress
  minio:
    profiles: ["documents"]
    image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    environment:
      MINIO_ROOT_USER: ${PHASE5_S3_ACCESS_KEY:-local-only-not-production}
      MINIO_ROOT_PASSWORD: ${PHASE5_S3_SECRET_KEY:-local-only-not-production}
      MINIO_DEFAULT_BUCKETS: perchpoint-documents
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data
  clamav:
    profiles: ["documents"]
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - data
volumes:
  perchpoint_pg:
  minio:
networks:
  data:
  ingress:
