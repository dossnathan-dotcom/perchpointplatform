name: nightly
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  benchmark:
    name: design-mix-benchmark
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-production
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PHASE3_ENVIRONMENT: local
      PHASE2_LOCAL_AUTH: development
      PHASE2_ADMIN_URL: postgresql+psycopg://postgres:ci-only-not-production@127.0.0.1:5432/postgres
      PHASE2_MIGRATOR_URL: postgresql+psycopg://perchpoint_migrator:ci-only-not-production@127.0.0.1:5432/perchpoint_phase2
      PHASE2_RUNTIME_URL: postgresql+psycopg://perchpoint_runtime:ci-only-not-production@127.0.0.1:5432/perchpoint_phase2
      PHASE2_JWT_SECRET: ci-only-not-production-jwt-value
      PHASE2_DEV_PASSWORD: ci-only-not-production-password
      PHASE2_WEBHOOK_SECRET: ci-only-not-production-webhook
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt
      - run: python -m perchpoint.bootstrap
        working-directory: backend
      - run: python -m tests.phase2.benchmark_inventory
        working-directory: backend
