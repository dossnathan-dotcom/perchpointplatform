name: windows-smoke
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: windows-compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -c "from pathlib import Path; lines=[line for line in Path('backend/requirements.txt').read_text().splitlines() if not line.startswith(('emergentintegrations==','litellm @'))]; Path('requirements-ci.txt').write_text('\n'.join(lines)+'\n')"
      - run: pip install -r requirements-ci.txt pymupdf==1.28.2
      - run: python -m compileall -q perchpoint
        working-directory: backend
      - run: python -m ruff check perchpoint
        working-directory: backend
