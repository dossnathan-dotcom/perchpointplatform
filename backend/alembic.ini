[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://perchpoint_migrator:local@127.0.0.1:5432/perchpoint_phase2

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
